name: build-and-push

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    paths:
      - '.github/workflows/ghcr.yml'
      - '.github/release-notes-template.md'
      - 'scripts/release_notes.py'
      - 'scripts/test_release_notes.py'
      - 'Dockerfile'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to rebuild; leave empty to validate this branch without publishing'
        required: false
        type: string

concurrency:
  group: versioned-image-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      image: ${{ steps.image.outputs.image }}
      tags: ${{ steps.image.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Test release tooling
        run: python3 -S scripts/test_release_notes.py -v

      - name: Validate version tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != 'pull_request' && ( -n "$INPUT_TAG" || "$REF_TYPE" == 'tag' ) ]]; then
            tag="${INPUT_TAG:-$REF_NAME}"
            python3 scripts/release_notes.py metadata "$tag" --github-output "$GITHUB_OUTPUT"
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve image names
        id: image
        env:
          PUBLISH: ${{ steps.release.outputs.publish }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          IS_LATEST: ${{ steps.release.outputs.is_latest_stable }}
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$PUBLISH" == 'true' ]]; then
            image="$repository:$RELEASE_TAG"
          else
            image="$repository:build-${GITHUB_SHA:0:12}"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<IMAGE_TAGS'
            echo "$image"
            if [[ "$PUBLISH" == 'true' && "$IS_LATEST" == 'true' ]]; then
              echo "$repository:latest"
            fi
            echo 'IMAGE_TAGS'
          } >> "$GITHUB_OUTPUT"

  check-image:
    name: Build and smoke-test image
    needs: prepare
    if: needs.prepare.outputs.publish != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build validation image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ needs.prepare.outputs.image }}
          cache-from: type=gha,scope=versioned-image
          cache-to: type=gha,mode=max,scope=versioned-image

      - name: Verify container startup
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
        run: |
          set -euo pipefail
          trap 'docker logs release-smoke; docker rm -f release-smoke >/dev/null' EXIT
          cp config.toml.example "$RUNNER_TEMP/release-smoke.toml"
          docker run --detach --name release-smoke \
            --publish 127.0.0.1:17856:7856 \
            --mount "type=bind,source=$RUNNER_TEMP/release-smoke.toml,target=/app/config.toml,readonly" \
            "$IMAGE"
          for _ in {1..30}; do
            status="$(curl --silent --max-time 5 --output "$RUNNER_TEMP/release-health.json" \
              --write-out '%{http_code}' http://127.0.0.1:17856/health || true)"
            if [[ "$status" == '503' ]] && python3 -c '
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as response:
              health = json.load(response)
          sys.exit(not (
              health.get("status") == "unhealthy"
              and health.get("db") is True
              and health.get("sqlite_vec") is True
              and "vec_dimension" in health
              and health.get("vec_dimension") is None
          ))
          ' "$RUNNER_TEMP/release-health.json" \
              && curl --fail --silent --max-time 5 --output /dev/null http://127.0.0.1:17856/; then
              echo "Built and smoke-tested \`$IMAGE\` with its expected empty-database health status without publishing." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 2
          done
          echo '::error::The validation image did not reach its expected empty-database startup state.'
          exit 1

      - name: Export validation image
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
        run: |
          set -euo pipefail
          docker save "$IMAGE" | gzip > "$RUNNER_TEMP/oj-api-rs-validation-image.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: oj-api-rs-validation-image
          path: ${{ runner.temp }}/oj-api-rs-validation-image.tar.gz
          retention-days: 3
          if-no-files-found: error

  publish-image:
    name: Publish versioned image
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ needs.prepare.outputs.tags }}
          cache-from: type=gha,scope=versioned-image
          cache-to: type=gha,mode=max,scope=versioned-image

      - name: Record published image
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Published \`$IMAGE\` (\`$DIGEST\`)." >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create release draft
    needs: [prepare, publish-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Create English release notes after image publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags.txt"
          if grep --fixed-strings --line-regexp --quiet -- "$RELEASE_TAG" "$RUNNER_TEMP/release-tags.txt"; then
            echo "Release $RELEASE_TAG already exists; preserving its notes and publication status."
            exit 0
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          python3 scripts/release_notes.py generate "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --output "$notes"
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --prerelease="$PRERELEASE" --latest=false \
            --title "oj-api-rs ${RELEASE_TAG#v}" --notes-file "$notes"
          echo "Created an English release draft for \`$RELEASE_TAG\`; fill in the summary and highlights before publishing." >> "$GITHUB_STEP_SUMMARY"
