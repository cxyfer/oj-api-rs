name: build-and-push-nightly

on:
  push:
    branches:
      - master

permissions:
  contents: write
  packages: write

jobs:
  build:
    if: ${{ github.ref_type == 'branch' && github.ref_name == 'master' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release tag on HEAD
        id: release_tag
        run: |
          if git tag --points-at HEAD --list 'v*.*.*' | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Release tag found on HEAD; skipping nightly build."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.release_tag.outputs.present != 'true'

      - uses: docker/login-action@v3
        if: steps.release_tag.outputs.present != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.release_tag.outputs.present != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:nightly
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create/update nightly pre-release
        if: steps.release_tag.outputs.present != 'true'
        run: |
          # Delete existing nightly release and tag (if any)
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          # Create new nightly pre-release pointing to current master HEAD
          NOTES="Automated pre-release build from \`master\` branch.

          **Commit:** \`${{ github.sha }}\`
          **Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')

          **Docker image:** \`ghcr.io/${{ github.repository }}:nightly\`

          Pull and test:
          \`\`\`bash
          docker compose -f docker-compose.ghcr.yml up -d
          \`\`\`"
          gh release create nightly \
            --prerelease \
            --title "Nightly Build" \
            --notes "$NOTES" \
            --target master
        env:
          GH_TOKEN: ${{ github.token }}
