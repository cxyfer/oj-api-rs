name: build-and-push-nightly

on:
  push:
    branches:
      - master

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:nightly
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create/update nightly pre-release
        run: |
          # Delete existing nightly release and tag (if any)
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          # Create new nightly pre-release pointing to current master HEAD
          gh release create nightly \
            --prerelease \
            --title "Nightly Build" \
            --notes "Automated pre-release build from \`master\` branch.

          **Commit:** \`${{ github.sha }}\`
          **Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')

          **Docker image:** \`ghcr.io/${{ github.repository }}:nightly\`

          Pull and test:
          \`\`\`bash
          docker compose -f docker-compose.ghcr.yml up -d
          \`\`\`"
            --target master
        env:
          GH_TOKEN: ${{ github.token }}
